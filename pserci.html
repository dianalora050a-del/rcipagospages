/* =========================================================
   OBTENER MONTO
========================================================= */

function obtenerMontoRaw(){

    try{

        const params =
            new URLSearchParams(
                window.location.search
            );

        return (

            params.get("monto") ||

            params.get("amount") ||

            localStorage.getItem(
                "finalAmount"
            ) ||

            sessionStorage.getItem(
                "finalAmount"
            ) ||

            localStorage.getItem(
                "total_pagar"
            ) ||

            sessionStorage.getItem(
                "total_pagar"
            ) ||

            ""

        );

    }catch(error){

        return "";

    }

}


/* =========================================================
   CONVERTIR MONTO
========================================================= */

function convertirMonto(valor){

    if(!valor){
        return 0;
    }

    let texto =
        String(valor)
        .trim()
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    if(
        texto.includes(".") &&
        texto.includes(",")
    ){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }

    else if(
        texto.includes(",")
    ){

        texto =
            texto.replace(",",".");
    }

    else if(
        texto.includes(".")
    ){

        const partes =
            texto.split(".");

        if(
            partes.length === 2 &&
            partes[1].length === 3
        ){

            texto =
                texto.replace(".","");

        }

    }


    texto =
        texto.replace(
            /[^\d.-]/g,
            ""
        );


    const numero =
        Number(texto);


    return Number.isFinite(numero)
        ? numero
        : 0;

}


/* =========================================================
   FORMATO COP
========================================================= */

function formatCOP(valor){

    const numero =
        convertirMonto(valor);

    return "$ " +
        numero.toLocaleString(
            "es-CO",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:0
            }
        );

}


/* =========================================================
   MOSTRAR MONTO
========================================================= */

    const raw =
        obtenerMontoRaw();

    const numero =
        convertirMonto(raw);


    if(numero > 0){

        amount.value =
            numero.toLocaleString(

                }
            );

}


/* =========================================================
   RENDERIZAR BANCOS
========================================================= */

function renderBanks(lista = entidades){

    banks.innerHTML = "";


    const listaMostrar =
        selectedBank
        ? [selectedBank]
        : lista;


    if(!listaMostrar.length){

        banks.innerHTML = `

            <div class="empty">
                No se encontró ninguna entidad.
            </div>

        `;

        return;

    }


    listaMostrar.forEach(
        entidad => {

            const item =
                document.createElement("div");


            item.className =
                "bank";


            if(
                selectedBank &&
                selectedBank.v === entidad.v
            ){

                item.classList.add(
                    "selected"
                );

            }


            item.innerHTML = `

                <div
                    class="bank-icon"
                    style="
                        background:${entidad.color}
                    "
                >
                    ${entidad.icon}
                </div>


                <div class="bank-info">

                    <div class="bank-name">
                        ${entidad.l}
                    </div>

                    <div class="bank-type">
                        ${
                            selectedBank
                            ? "Entidad seleccionada"
                            : "Entidad financiera"
                        }
                    </div>

                </div>


                <div class="check">
                    ✓
                </div>

            `;


            if(!selectedBank){

                item.addEventListener(
                    "click",
                    function(){

                        selectedBank =
                            entidad;


                        searchContainer
                            .style
                            .display = "none";


                        renderBanks();


                        updateButton();

                    }
                );

            }


            banks.appendChild(item);

        }
    );


    /*
     * BOTÓN CAMBIAR ENTIDAD
     */

    if(selectedBank){

        const changeButton =
            document.createElement(
                "button"
            );


        changeButton.type =
            "button";


        changeButton.className =
            "change-bank";


        changeButton.textContent =
            "Cambiar entidad";


        changeButton.addEventListener(
            "click",
            function(){

                selectedBank =
                    null;


                bankSearch.value =
                    "";


                searchContainer
                    .style
                    .display = "block";


                renderBanks(
                    entidades
                );


                updateButton();

            }
        );


        banks.parentElement
            .appendChild(
                changeButton
            );

    }

}

function filtrarBancos(texto){

    const busqueda =
        String(texto || "")
        .toLowerCase()
        .trim();


    if(!busqueda){

        return entidades;

    }


    return entidades.filter(
        entidad =>
            entidad.l
            .toLowerCase()
            .includes(busqueda)
    );

}


bankSearch.addEventListener(
    "input",
    function(){

        if(selectedBank){
            return;
        }


        renderBanks(
            filtrarBancos(
                bankSearch.value
            )
        );

    }
);


/* =========================================================
   ACTUALIZAR BOTÓN
========================================================= */

function updateButton(){

    const monto =
        convertirMonto(
            amount.value
        );


    continueBtn.disabled =
        !(monto > 0 && selectedBank);

}


/* =========================================================
   CONTINUAR
========================================================= */

continueBtn.addEventListener(
    "click",
    function(){

        const monto =
            convertirMonto(
                amount.value
            );


        if(
            !monto ||
            !selectedBank
        ){

            return;

        }


        const url =
            urlsEntidades[
                selectedBank.v
            ];


        if(!url){

            alert(
                "No hay una página configurada para esta entidad."
            );

            return;

        }


        /*
         * Guardamos los datos por si
         * posteriormente se necesitan.
         */

        sessionStorage.setItem(
            "entidadSeleccionada",
            selectedBank.v
        );


        sessionStorage.setItem(
            "montoPago",
            String(monto)
        );


        /*
         * REDIRECCIÓN
         *
         * Se abre la página oficial
         * correspondiente a la entidad.
         */

        window.location.href = url;

    }
);


/* =========================================================
   VOLVER
========================================================= */

backBtn.addEventListener(
    "click",
    function(){

        if(
            window.history.length > 1
        ){

            window.history.back();

        }else{

            window.location.href = "/";

        }

    }
);


/* =========================================================
   INICIALIZACIÓN
========================================================= */

renderBanks();

mostrarMonto();

</script>

</body>
</html>
