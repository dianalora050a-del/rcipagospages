<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSE - Pago seguro</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .topbar {
            background: #ffffff;
            border-bottom: 1px solid #e4e4e4;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pse-logo {
            font-size: 34px;
            font-weight: 800;
            color: #00a859;
            letter-spacing: -1px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }

        .title {
            text-align: center;
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .amount {
            margin-bottom: 25px;
        }

        .amount label,
        .bank-section label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #444;
        }

        .input {
            width: 100%;
            height: 50px;
            border: 1px solid #d7d7d7;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 18px;
            outline: none;
            background: #fafafa;
        }

        .input:focus {
            border-color: #00a859;
            background: #fff;
        }

        .bank-search {
            margin-bottom: 12px;
        }

        .banks {
            max-height: 330px;
            overflow-y: auto;
            border: 1px solid #e2e2e2;
            border-radius: 10px;
            background: #fff;
        }

        .bank {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 14px;
            border-bottom: 1px solid #eeeeee;
            cursor: pointer;
            transition: background 0.2s;
        }

        .bank:last-child {
            border-bottom: none;
        }

        .bank:hover {
            background: #f4fbf7;
        }

        .bank.selected {
            background: #e9f8f0;
            border-left: 4px solid #00a859;
        }

        .bank-logo {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #00a859;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .bank-name {
            font-size: 15px;
            font-weight: 600;
            color: #333;
        }

        .continue {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 8px;
            margin-top: 22px;
            background: #00a859;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .continue:hover {
            background: #008f4b;
        }

        .continue:disabled {
            background: #b9b9b9;
            cursor: not-allowed;
        }

        .back {
            width: 100%;
            background: transparent;
            border: none;
            color: #00a859;
            font-size: 14px;
            margin-top: 15px;
            cursor: pointer;
        }

        .result {
            display: none;
            margin-top: 22px;
            border-radius: 10px;
            background: #f4fbf7;
            border: 1px solid #bfe8d1;
            padding: 18px;
        }

        .result-title {
            font-weight: 700;
            margin-bottom: 12px;
            color: #222;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 7px 0;
            font-size: 14px;
        }

        .result-row span:first-child {
            color: #777;
        }

        .result-row span:last-child {
            font-weight: 700;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin-top: 25px;
            line-height: 1.5;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #888;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .topbar {
                height: 60px;
            }

            .pse-logo {
                font-size: 30px;
            }

            .container {
                margin: 20px auto;
                padding: 0 12px;
            }

            .card {
                padding: 20px 16px;
                border-radius: 10px;
            }

            .title {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="pse-logo">PSE</div>
    </header>

    <main class="container">

        <section class="card">

            <div class="title">
                Realiza tu pago
            </div>

            <div class="subtitle">
                Selecciona tu entidad financiera para continuar
            </div>

            <!-- VALOR -->
            <div class="amount">
                <label for="amount">Valor a pagar</label>

                <input
                    id="amount"
                    class="input"
                    type="text"
                    inputmode="numeric"
                    placeholder="$ 0"
                    autocomplete="off"
                    readonly
                >
            </div>

            <!-- BANCOS -->
            <div class="bank-section">

                <label for="bankSearch">
                    Selecciona tu banco
                </label>

                <div class="bank-search">
                    <input
                        id="bankSearch"
                        class="input"
                        type="text"
                        placeholder="Buscar banco..."
                        autocomplete="off"
                    >
                </div>

                <div class="banks" id="banks"></div>

            </div>

            <button
                class="continue"
                id="continueBtn"
                disabled
            >
                Continuar
            </button>

            <button
                class="back"
                id="backBtn"
                type="button"
            >
                Volver
            </button>

            <!-- RESULTADO -->
            <div class="result" id="result">

                <div class="result-title">
                    Resumen del pago
                </div>

                <div class="result-row">
                    <span>Valor a pagar</span>
                    <span id="resultAmount">$ 0</span>
                </div>

                <div class="result-row">
                    <span>Entidad seleccionada</span>
                    <span id="resultBank">-</span>
                </div>

            </div>

        </section>

        <div class="footer">
            Serás dirigido al proceso de pago correspondiente después de continuar.
        </div>

    </main>

    <script>

        /*
         * ============================================================
         * ENTIDADES DISPONIBLES
         * ============================================================
         */

        const entidades = [
            { v: 'Nequi', l: 'Nequi' },
            { v: 'Bancolombia', l: 'Bancolombia' },
            { v: 'Davivienda', l: 'Davivienda' },
            { v: 'Banco de Bogotá', l: 'Banco de Bogotá' },
            { v: 'Banco Popular', l: 'Banco Popular' },
            { v: 'Banco de Occidente', l: 'Banco de Occidente' },
            { v: 'Banco AV Villas', l: 'Banco AV Villas' },
            { v: 'Banco Caja Social', l: 'Banco Caja Social' },
            { v: 'BBVA Colombia', l: 'BBVA Colombia' },
            { v: 'Scotiabank Colpatria', l: 'Scotiabank Colpatria' },
            { v: 'Banco Agrario de Colombia', l: 'Banco Agrario de Colombia' },
            { v: 'Banco GNB Sudameris', l: 'Banco GNB Sudameris' },
            { v: 'Banco Falabella', l: 'Banco Falabella' },
            { v: 'Banco Itaú', l: 'Banco Itaú' },
            { v: 'Daviplata', l: 'Daviplata' },
            { v: 'Lulo Bank', l: 'Lulo Bank' },
            { v: 'Nu Colombia', l: 'Nu Colombia' },
            { v: 'Rappipay', l: 'Rappipay' },
            { v: 'Movii', l: 'Movii' },
            { v: 'Ualá', l: 'Ualá' },
            { v: 'Banco Pichincha', l: 'Banco Pichincha' },
            { v: 'Banco W', l: 'Banco W' },
            { v: 'Banco Mundo Mujer', l: 'Banco Mundo Mujer' },
            { v: 'Bancamía', l: 'Bancamía' },
            { v: 'Confiar Cooperativa Financiera', l: 'Confiar Cooperativa Financiera' },
            { v: 'Cotrafa Cooperativa Financiera', l: 'Cotrafa Cooperativa Financiera' },
            { v: 'Coltefinanciera', l: 'Coltefinanciera' },
            { v: 'Juriscoop', l: 'Juriscoop' },
            { v: 'Pibank', l: 'Pibank' }
        ];


        /*
         * ============================================================
         * ELEMENTOS
         * ============================================================
         */

        const amount = document.getElementById('amount');
        const bankSearch = document.getElementById('bankSearch');
        const banksContainer = document.getElementById('banks');
        const continueBtn = document.getElementById('continueBtn');
        const backBtn = document.getElementById('backBtn');

        const result = document.getElementById('result');
        const resultAmount = document.getElementById('resultAmount');
        const resultBank = document.getElementById('resultBank');

        let selectedBank = null;


        /*
         * ============================================================
         * OBTENER MONTO
         *
         * Prioridad:
         *
         * 1. ?monto=
         * 2. ?amount=
         * 3. localStorage.finalAmount
         * 4. sessionStorage.finalAmount
         * 5. localStorage.total_pagar
         * 6. sessionStorage.total_pagar
         * ============================================================
         */

        function obtenerMontoRaw() {

            try {

                const params = new URLSearchParams(
                    window.location.search
                );

                return (
                    params.get('monto') ||
                    params.get('amount') ||
                    localStorage.getItem('finalAmount') ||
                    sessionStorage.getItem('finalAmount') ||
                    localStorage.getItem('total_pagar') ||
                    sessionStorage.getItem('total_pagar') ||
                    ''
                );

            } catch (error) {

                return '';

            }

        }


        /*
         * ============================================================
         * CONVERTIR MONTO A NUMERO
         * ============================================================
         */

        function convertirMonto(valor) {

            if (!valor) {
                return 0;
            }

            let texto = String(valor)
                .trim()
                .replace(/\$/g, '')
                .replace(/\s/g, '');

            /*
             * Ejemplo:
             *
             * 171.400,50
             * ->
             * 171400.50
             */

            if (
                texto.includes('.') &&
                texto.includes(',')
            ) {

                texto = texto
                    .replace(/\./g, '')
                    .replace(',', '.');

            }

            /*
             * Ejemplo:
             *
             * 171400,50
             * ->
             * 171400.50
             */

            else if (texto.includes(',')) {

                texto = texto.replace(',', '.');

            }

            /*
             * Ejemplo:
             *
             * 171.400
             *
             * Se interpreta como:
             *
             * 171400
             */

            else if (texto.includes('.')) {

                const partes = texto.split('.');

                if (
                    partes.length === 2 &&
                    partes[1].length === 3
                ) {

                    texto = texto.replace('.', '');

                }

            }

            texto = texto.replace(/[^\d.-]/g, '');

            const numero = Number(texto);

            return Number.isFinite(numero)
                ? numero
                : 0;

        }


        /*
         * ============================================================
         * FORMATO COP
         * ============================================================
         */

        function formatCOP(valor) {

            const numero = convertirMonto(valor);

            return '$ ' + numero.toLocaleString(
                'es-CO',
                {
                    minimumFractionDigits: 0,
                    maximumFractionDigits: 0
                }
            );

        }


        /*
         * ============================================================
         * MOSTRAR MONTO
         * ============================================================
         */

        function mostrarMonto() {

            const montoOriginal = obtenerMontoRaw();

            const totalPagarNumero =
                convertirMonto(montoOriginal);

            if (totalPagarNumero > 0) {

                amount.value =
                    totalPagarNumero.toLocaleString(
                        'es-CO',
                        {
                            minimumFractionDigits: 0,
                            maximumFractionDigits: 0
                        }
                    );

            } else {

                amount.value = '';

            }

            updateButton();

        }


        /*
         * ============================================================
         * INICIALES DEL BANCO
         * ============================================================
         */

        function initials(nombre) {

            const palabras = nombre
                .split(' ')
                .filter(Boolean);

            if (palabras.length === 1) {

                return palabras[0]
                    .substring(0, 2)
                    .toUpperCase();

            }

            return (
                palabras[0][0] +
                palabras[1][0]
            ).toUpperCase();

        }


        /*
         * ============================================================
         * RENDERIZAR BANCOS
         * ============================================================
         */

        function renderBanks(lista = entidades) {

            banksContainer.innerHTML = '';

            if (!lista.length) {

                banksContainer.innerHTML = `
                    <div class="empty">
                        No se encontraron entidades.
                    </div>
                `;

                return;

            }

            lista.forEach(entidad => {

                const bank = document.createElement('div');

                bank.className = 'bank';

                if (
                    selectedBank &&
                    selectedBank.v === entidad.v
                ) {

                    bank.classList.add('selected');

                }

                bank.innerHTML = `
                    <div class="bank-logo">
                        ${initials(entidad.l)}
                    </div>

                    <div class="bank-name">
                        ${entidad.l}
                    </div>
                `;

                bank.addEventListener(
                    'click',
                    function() {

                        selectedBank = entidad;

                        renderBanks(
                            filtrarBancos(
                                bankSearch.value
                            )
                        );

                        updateButton();

                    }
                );

                banksContainer.appendChild(bank);

            });

        }


        /*
         * ============================================================
         * FILTRAR BANCOS
         * ============================================================
         */

        function filtrarBancos(texto) {

            const busqueda =
                String(texto || '')
                    .toLowerCase()
                    .trim();

            if (!busqueda) {

                return entidades;

            }

            return entidades.filter(
                entidad =>
                    entidad.l
                        .toLowerCase()
                        .includes(busqueda)
            );

        }


        /*
         * ============================================================
         * BUSCADOR
         * ============================================================
         */

        bankSearch.addEventListener(
            'input',
            function() {

                renderBanks(
                    filtrarBancos(
                        bankSearch.value
                    )
                );

            }
        );


        /*
         * ============================================================
         * BOTÓN CONTINUAR
         * ============================================================
         */

        function updateButton() {

            const monto =
                convertirMonto(
                    amount.value
                );

            continueBtn.disabled =
                !(monto > 0 && selectedBank);

        }


        /*
         * ============================================================
         * CONTINUAR
         *
         * Solo muestra el resumen.
         * No solicita ni transmite credenciales bancarias.
         * ============================================================
         */

        continueBtn.addEventListener(
            'click',
            function() {

                const monto =
                    convertirMonto(
                        amount.value
                    );

                if (!monto || !selectedBank) {

                    return;

                }

                resultAmount.textContent =
                    formatCOP(monto);

                resultBank.textContent =
                    selectedBank.l;

                result.style.display =
                    'block';

                result.scrollIntoView({
                    behavior: 'smooth',
                    block: 'nearest'
                });

            }
        );


        /*
         * ============================================================
         * VOLVER
         * ============================================================
         */

        backBtn.addEventListener(
            'click',
            function() {

                if (window.history.length > 1) {

                    window.history.back();

                } else {

                    window.location.href = '/';

                }

            }
        );


        /*
         * ============================================================
         * INICIALIZACIÓN
         * ============================================================
         */

        renderBanks();

        mostrarMonto();

    </script>

</body>
</html>
