<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nequi - Pago</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #200020;
            padding: 25px 20px 30px;
            color: white;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .amount {
            font-size: 21px;
            font-weight: bold;
            margin-top: 10px;
        }

        .content {
            padding: 30px 25px;
            flex: 1;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #222;
        }

        .description {
            font-size: 15px;
            line-height: 1.5;
            color: #666;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #e5007d;
            box-shadow: 0 0 0 2px rgba(229, 0, 125, .1);
        }

        .button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 26px;
            background: #e5007d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .button:hover {
            background: #c9006d;
        }

        .button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }

        .message.success {
            display: block;
            background: #e9f8ef;
            color: #18733a;
        }

        .message.error {
            display: block;
            background: #fdeaea;
            color: #a52828;
        }

        .security {
            margin-top: 25px;
            padding: 15px;
            background: #f7f7f7;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
            color: #666;
            text-align: center;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
        }

        @media (min-width: 421px) {
            .container {
                min-height: auto;
                margin: 30px auto;
                border-radius: 12px;
                overflow: hidden;
                box-shadow: 0 4px 25px rgba(0, 0, 0, .1);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">Nequi</div>

        <div class="amount" id="monto">
            Monto: $ 0
        </div>
    </header>

    <main class="content">

        <h1 class="title">Realizar pago</h1>

        <p class="description">
            Ingresa la información solicitada para continuar con el proceso de pago.
        </p>

        <form id="paymentForm">

            <div class="form-group">
                <label for="telefono">
                    Número de celular
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    inputmode="numeric"
                    autocomplete="tel"
                    maxlength="10"
                    placeholder="Número de celular"
                    required
                >
            </div>

            <button
                type="submit"
                class="button"
                id="continuarBtn"
            >
                Continuar
            </button>

        </form>

        <div id="mensaje" class="message"></div>

        <div class="security">
            🔒 Tus datos deben ser tratados únicamente por el
            proveedor autorizado del pago. No compartas claves,
            códigos de seguridad ni contraseñas.
        </div>

    </main>

    <footer class="footer">
        Pago seguro · Todos los derechos reservados
    </footer>

</div>

<script>
    // =========================================================
    // OBTENER EL MONTO DESDE LA URL
    // Ejemplo:
    // nequi.html?monto=171400
    // =========================================================

    const params = new URLSearchParams(window.location.search);

    const montoParametro = params.get("monto");

    // Solo aceptamos números positivos
    const monto = Number(montoParametro);

    const montoEl = document.getElementById("monto");

    function formatearCOP(valor) {
        return valor.toLocaleString("es-CO", {
            style: "currency",
            currency: "COP",
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });
    }

    if (Number.isFinite(monto) && monto > 0) {
        montoEl.textContent = "Monto: " + formatearCOP(monto);
    } else {
        montoEl.textContent = "Monto: $ 0";
    }


    // =========================================================
    // FORMULARIO
    // =========================================================

    const form = document.getElementById("paymentForm");
    const telefono = document.getElementById("telefono");
    const boton = document.getElementById("continuarBtn");
    const mensaje = document.getElementById("mensaje");


    // Permitir únicamente números
    telefono.addEventListener("input", function () {
        this.value = this.value.replace(/\D/g, "").slice(0, 10);
    });


    form.addEventListener("submit", function (event) {

        event.preventDefault();

        const numero = telefono.value.trim();

        mensaje.className = "message";
        mensaje.textContent = "";

        // Validación básica
        if (!/^\d{10}$/.test(numero)) {

            mensaje.className = "message error";
            mensaje.textContent =
                "Ingresa un número de celular válido de 10 dígitos.";

            return;
        }

        if (!Number.isFinite(monto) || monto <= 0) {

            mensaje.className = "message error";
            mensaje.textContent =
                "No se encontró un monto de pago válido.";

            return;
        }

        // Deshabilitar botón
        boton.disabled = true;
        boton.textContent = "Procesando...";

        /*
         * Aquí debe ir únicamente la integración legítima
         * con tu backend/proveedor de pagos.
         *
         * No se envían datos a Telegram ni se almacenan
         * credenciales o códigos de autenticación.
         */

        setTimeout(function () {

            mensaje.className = "message success";

            mensaje.textContent =
                "Solicitud recibida correctamente.";

            boton.disabled = false;
            boton.textContent = "Continuar";

        }, 1200);
    });
</script>

</body>
</html>
