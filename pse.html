<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSE RCI</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f5f7;
    color:#252525;
}

.header{
    height:72px;
    background:#fff;
    border-bottom:1px solid #e5e5e5;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:30px;
    font-weight:800;
    letter-spacing:-1px;
}

.logo-pse{
    color:#00a859;
}

.logo-rci{
    color:#333;
}

.logo-separator{
    color:#bbb;
    font-weight:400;
}

.container{
    width:100%;
    max-width:650px;
    margin:32px auto;
    padding:0 16px;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:28px;
    box-shadow:0 5px 22px rgba(0,0,0,.08);
}

.title{
    text-align:center;
    font-size:24px;
    font-weight:700;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:25px;
}

.label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
}

.input{
    width:100%;
    height:50px;
    border:1px solid #d8d8d8;
    border-radius:9px;
    padding:0 15px;
    font-size:17px;
    outline:none;
    background:#fafafa;
}

.input:focus{
    border-color:#00a859;
    background:#fff;
}

.amount{
    margin-bottom:24px;
}

.search{
    margin-bottom:12px;
}

.banks{
    max-height:360px;
    overflow-y:auto;
    border:1px solid #e2e2e2;
    border-radius:11px;
}

.bank{
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    transition:.18s;
    background:#fff;
}

.bank:last-child{
    border-bottom:0;
}

.bank:hover{
    background:#f5fbf8;
}

.bank.selected{
    background:#e8f8f0;
    border-left:4px solid #00a859;
    padding-left:9px;
}

.bank-icon{
    width:44px;
    height:44px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
    font-weight:800;
    flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,.12);
}

.bank-info{
    min-width:0;
    flex:1;
}

.bank-name{
    font-size:15px;
    font-weight:700;
}

.bank-type{
    color:#888;
    font-size:12px;
    margin-top:3px;
}

.check{
    width:22px;
    height:22px;
    border-radius:50%;
    border:2px solid #d4d4d4;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:12px;
}

.bank.selected .check{
    background:#00a859;
    border-color:#00a859;
}

.continue{
    width:100%;
    height:52px;
    margin-top:22px;
    border:0;
    border-radius:9px;
    background:#00a859;
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

.continue:hover{
    background:#008e4b;
}

.continue:disabled{
    background:#bcbcbc;
    cursor:not-allowed;
}

.back{
    display:block;
    width:100%;
    margin-top:14px;
    border:0;
    background:none;
    color:#00a859;
    font-size:14px;
    cursor:pointer;
}

.result{
    display:none;
    margin-top:22px;
    padding:18px;
    border:1px solid #bde7cf;
    border-radius:10px;
    background:#f2fbf6;
}

.result-title{
    font-weight:700;
    margin-bottom:12px;
}

.result-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:6px 0;
    font-size:14px;
}

.result-row span:first-child{
    color:#777;
}

.result-row span:last-child{
    font-weight:700;
}

.empty{
    padding:25px;
    text-align:center;
    color:#888;
    font-size:14px;
}

.footer{
    text-align:center;
    color:#888;
    font-size:12px;
    line-height:1.5;
    margin:22px auto 0;
}

@media(max-width:600px){

    .header{
        height:64px;
    }

    .logo{
        font-size:26px;
    }

    .container{
        margin:18px auto;
        padding:0 11px;
    }

    .card{
        padding:20px 15px;
        border-radius:12px;
    }

    .title{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">
        <span class="logo-pse">PSE</span>
        <span class="logo-separator">|</span>
        <span class="logo-rci">RCI</span>
    </div>
</header>

<main class="container">

<section class="card">

    <div class="title">
        Realiza tu pago
    </div>

    <div class="subtitle">
        Selecciona la entidad financiera
    </div>

    <!-- VALOR -->
    <div class="amount">
        <label class="label" for="amount">
            Valor a pagar
        </label>

        <input
            id="amount"
            class="input"
            type="text"
            readonly
            placeholder="$ 0"
        >
    </div>

    <!-- BANCOS -->
    <label class="label">
        Entidad financiera
    </label>

    <div class="search">
        <input
            id="bankSearch"
            class="input"
            type="text"
            placeholder="Buscar banco..."
            autocomplete="off"
        >
    </div>

    <div class="banks" id="banks"></div>

    <button
        id="continueBtn"
        class="continue"
        disabled
    >
        Continuar
    </button>

    <button
        id="backBtn"
        class="back"
        type="button"
    >
        Volver
    </button>

    <div class="result" id="result">

        <div class="result-title">
            Resumen
        </div>

        <div class="result-row">
            <span>Valor a pagar</span>
            <span id="resultAmount">$ 0</span>
        </div>

        <div class="result-row">
            <span>Entidad</span>
            <span id="resultBank">-</span>
        </div>

    </div>

</section>

<div class="footer">
    Selecciona una entidad financiera para continuar con el proceso.
</div>

</main>

<script>

const entidades = [

    {
        v:"Nequi",
        l:"Nequi",
        icon:"N",
        color:"#df008d"
    },

    {
        v:"Bancolombia",
        l:"Bancolombia",
        icon:"B",
        color:"#ffcf00"
    },

    {
        v:"Davivienda",
        l:"Davivienda",
        icon:"D",
        color:"#ed1c24"
    },

    {
        v:"Banco de Bogotá",
        l:"Banco de Bogotá",
        icon:"BD",
        color:"#004b87"
    },

    {
        v:"Banco Popular",
        l:"Banco Popular",
        icon:"BP",
        color:"#00549c"
    },

    {
        v:"Banco de Occidente",
        l:"Banco de Occidente",
        icon:"BO",
        color:"#003b70"
    },

    {
        v:"Banco AV Villas",
        l:"Banco AV Villas",
        icon:"AV",
        color:"#0072bc"
    },

    {
        v:"Banco Caja Social",
        l:"Banco Caja Social",
        icon:"CS",
        color:"#008f5a"
    },

    {
        v:"BBVA Colombia",
        l:"BBVA Colombia",
        icon:"BB",
        color:"#072146"
    },

    {
        v:"Scotiabank Colpatria",
        l:"Scotiabank Colpatria",
        icon:"SC",
        color:"#e31837"
    },

    {
        v:"Banco Agrario de Colombia",
        l:"Banco Agrario de Colombia",
        icon:"BA",
        color:"#00843d"
    },

    {
        v:"Banco GNB Sudameris",
        l:"Banco GNB Sudameris",
        icon:"GN",
        color:"#005b9a"
    },

    {
        v:"Banco Falabella",
        l:"Banco Falabella",
        icon:"BF",
        color:"#00a6ce"
    },

    {
        v:"Banco Itaú",
        l:"Banco Itaú",
        icon:"IT",
        color:"#ec7000"
    },

    {
        v:"Daviplata",
        l:"Daviplata",
        icon:"DP",
        color:"#e60000"
    },

    {
        v:"Lulo Bank",
        l:"Lulo Bank",
        icon:"L",
        color:"#4c1d95"
    },

    {
        v:"Nu Colombia",
        l:"Nu Colombia",
        icon:"Nu",
        color:"#820ad1"
    },

    {
        v:"Rappipay",
        l:"Rappipay",
        icon:"RP",
        color:"#ff1744"
    },

    {
        v:"Movii",
        l:"Movii",
        icon:"M",
        color:"#ff0054"
    },

    {
        v:"Ualá",
        l:"Ualá",
        icon:"U",
        color:"#162447"
    },

    {
        v:"Banco Pichincha",
        l:"Banco Pichincha",
        icon:"BP",
        color:"#0066a1"
    },

    {
        v:"Banco W",
        l:"Banco W",
        icon:"W",
        color:"#f28c00"
    },

    {
        v:"Banco Mundo Mujer",
        l:"Banco Mundo Mujer",
        icon:"MM",
        color:"#e4007d"
    },

    {
        v:"Bancamía",
        l:"Bancamía",
        icon:"BM",
        color:"#008c95"
    },

    {
        v:"Confiar Cooperativa Financiera",
        l:"Confiar Cooperativa Financiera",
        icon:"C",
        color:"#006b54"
    },

    {
        v:"Cotrafa Cooperativa Financiera",
        l:"Cotrafa Cooperativa Financiera",
        icon:"CF",
        color:"#0067a5"
    },

    {
        v:"Coltefinanciera",
        l:"Coltefinanciera",
        icon:"CF",
        color:"#164a84"
    },

    {
        v:"Juriscoop",
        l:"Juriscoop",
        icon:"J",
        color:"#009b77"
    },

    {
        v:"Pibank",
        l:"Pibank",
        icon:"PI",
        color:"#00a99d"
    }

];

const amount = document.getElementById("amount");
const bankSearch = document.getElementById("bankSearch");
const banks = document.getElementById("banks");
const continueBtn = document.getElementById("continueBtn");
const backBtn = document.getElementById("backBtn");

const result = document.getElementById("result");
const resultAmount = document.getElementById("resultAmount");
const resultBank = document.getElementById("resultBank");

let selectedBank = null;


/* =========================================================
   OBTENER MONTO
========================================================= */

function obtenerMontoRaw(){

    try{

        const params =
            new URLSearchParams(
                window.location.search
            );

        return (
            params.get("monto") ||
            params.get("amount") ||
            localStorage.getItem("finalAmount") ||
            sessionStorage.getItem("finalAmount") ||
            localStorage.getItem("total_pagar") ||
            sessionStorage.getItem("total_pagar") ||
            ""
        );

    }catch(error){

        return "";

    }

}


/* =========================================================
   CONVERTIR MONTO
========================================================= */

function convertirMonto(valor){

    if(!valor){
        return 0;
    }

    let texto = String(valor)
        .trim()
        .replace(/\$/g,"")
        .replace(/\s/g,"");

    if(
        texto.includes(".") &&
        texto.includes(",")
    ){

        texto = texto
            .replace(/\./g,"")
            .replace(",",".");
    }

    else if(texto.includes(",")){

        texto = texto.replace(",",".");
    }

    else if(texto.includes(".")){

        const partes = texto.split(".");

        if(
            partes.length === 2 &&
            partes[1].length === 3
        ){

            texto = texto.replace(".","");

        }

    }

    texto = texto.replace(/[^\d.-]/g,"");

    const numero = Number(texto);

    return Number.isFinite(numero)
        ? numero
        : 0;

}


/* =========================================================
   FORMATO PESOS
========================================================= */

function formatCOP(valor){

    const numero = convertirMonto(valor);

    return "$ " +
        numero.toLocaleString(
            "es-CO",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:0
            }
        );

}


/* =========================================================
   MOSTRAR MONTO
========================================================= */

function mostrarMonto(){

    const raw = obtenerMontoRaw();

    const numero = convertirMonto(raw);

    if(numero > 0){

        amount.value =
            numero.toLocaleString(
                "es-CO",
                {
                    minimumFractionDigits:0,
                    maximumFractionDigits:0
                }
            );

    }else{

        amount.value = "";

    }

    updateButton();

}


/* =========================================================
   RENDER BANCOS
========================================================= */

function renderBanks(lista = entidades){

    banks.innerHTML = "";

    if(!lista.length){

        banks.innerHTML = `
            <div class="empty">
                No se encontró ninguna entidad.
            </div>
        `;

        return;
    }

    lista.forEach(entidad => {

        const item =
            document.createElement("div");

        item.className = "bank";

        if(
            selectedBank &&
            selectedBank.v === entidad.v
        ){

            item.classList.add("selected");

        }

        item.innerHTML = `

            <div
                class="bank-icon"
                style="background:${entidad.color}"
            >
                ${entidad.icon}
            </div>

            <div class="bank-info">

                <div class="bank-name">
                    ${entidad.l}
                </div>

                <div class="bank-type">
                    Entidad financiera
                </div>

            </div>

            <div class="check">
                ✓
            </div>

        `;

        item.addEventListener(
            "click",
            function(){

                selectedBank = entidad;

                renderBanks(
                    filtrarBancos(
                        bankSearch.value
                    )
                );

                updateButton();

            }
        );

        banks.appendChild(item);

    });

}


/* =========================================================
   FILTRO
========================================================= */

function filtrarBancos(texto){

    const busqueda =
        String(texto || "")
        .toLowerCase()
        .trim();

    if(!busqueda){
        return entidades;
    }

    return entidades.filter(
        entidad =>
            entidad.l
            .toLowerCase()
            .includes(busqueda)
    );

}

bankSearch.addEventListener(
    "input",
    function(){

        renderBanks(
            filtrarBancos(
                bankSearch.value
            )
        );

    }
);


/* =========================================================
   BOTÓN
========================================================= */

function updateButton(){

    const monto =
        convertirMonto(
            amount.value
        );

    continueBtn.disabled =
        !(monto > 0 && selectedBank);

}


/* =========================================================
   CONTINUAR
========================================================= */

continueBtn.addEventListener(
    "click",
    function(){

        const monto =
            convertirMonto(
                amount.value
            );

        if(!monto || !selectedBank){
            return;
        }

        resultAmount.textContent =
            formatCOP(monto);

        resultBank.textContent =
            selectedBank.l;

        result.style.display =
            "block";

        result.scrollIntoView({
            behavior:"smooth",
            block:"nearest"
        });

    }
);


/* =========================================================
   VOLVER
========================================================= */

backBtn.addEventListener(
    "click",
    function(){

        if(window.history.length > 1){

            window.history.back();

        }else{

            window.location.href = "/";

        }

    }
);


/* =========================================================
   INICIAR
========================================================= */

renderBanks();

mostrarMonto();

</script>

</body>
</html>
